<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; font-family: "Source Sans 3", "Segoe UI", sans-serif; color: #f4f7f6; }
      label { display: block; font-size: 14px; margin-bottom: 6px; }
      input { width: 100%; font-size: 13px; }
      #names { font-size: 12px; margin-top: 6px; opacity: 0.8; }
    </style>
  </head>
  <body>
    <label for="files">CSV exports</label>
    <input id="files" type="file" accept=".csv,text/csv" multiple />
    <div id="names"></div>
    <script>
      function send(type, data) {
        window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
      }
      function toBase64(buffer) {
        const bytes = new Uint8Array(buffer);
        let binary = "";
        for (let i = 0; i < bytes.length; i += 0x8000) {
          binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        }
        return btoa(binary);
      }
      document.getElementById("files").addEventListener("change", async (event) => {
        const chosen = Array.from(event.target.files || []);
        document.getElementById("names").textContent = chosen.map((file) => file.name).join(", ");
        const payload = [];
        for (const file of chosen) {
          payload.push({ name: file.name, data: toBase64(await file.arrayBuffer()) });
        }
        send("streamlit:setComponentValue", { value: payload, dataType: "json" });
      });
      send("streamlit:componentReady", { apiVersion: 1 });
      send("streamlit:setFrameHeight", { height: 72 });
    </script>
  </body>
</html>
